    - '%prefix% <color:#c19a6b><bold>ᴊᴇꜱᴛᴇʀ ᴀɴᴛɪ ᴄʜᴇᴀᴛ</bold></color> <dark_gray>—</dark_gray> <white>ᴄᴏᴍᴍᴀɴᴅ ʀᴇꜰᴇʀᴇɴᴄᴇ</white>'
    - '%prefix% <color:#c19a6b>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</color>'
    - '%prefix% <color:#a9c8ff>/jester alerts</color> <white>—</white> <gray>Toggle violation alerts</gray>'
    - '%prefix% <color:#a9c8ff>/jester verbose</color> <white>—</white> <gray>Toggle verbose alerts</gray>'
    - '%prefix% <color:#a9c8ff>/jester violations <player></color> <white>—</white> <gray>Per-check VL breakdown</gray>'
    - '%prefix% <color:#a9c8ff>/jester info <player></color> <white>—</white> <gray>Detailed player state</gray>'
    - '%prefix% <color:#a9c8ff>/jester cps <player></color> <white>—</white> <gray>Show click-per-second info</gray>'
    - '%prefix% <color:#a9c8ff>/jester history <player></color> <white>—</white> <gray>Violation history log</gray>'
    - '%prefix% <color:#a9c8ff>/jester freeze <player></color> <white>—</white> <gray>Toggle freeze on a player</gray>'
    - '%prefix% <color:#a9c8ff>/jester setback <player></color> <white>—</white> <gray>Manually setback a player</gray>'
    - '%prefix% <color:#a9c8ff>/jester tp <player></color> <white>—</white> <gray>Teleport to a player</gray>'
    - '%prefix% <color:#a9c8ff>/jester spectate <player></color> <white>—</white> <gray>Spectate a player</gray>'
    - '%prefix% <color:#a9c8ff>/jester clearviolations <player></color> <white>—</white> <gray>Clear all violations</gray>'
    - '%prefix% <color:#a9c8ff>/jester stats</color> <white>—</white> <gray>Server-wide anticheat statistics</gray>'
    - '%prefix% <color:#a9c8ff>/jester perf</color> <white>—</white> <gray>Performance metrics</gray>'
    - '%prefix% <color:#a9c8ff>/jester reload</color> <white>—</white> <gray>Reload configuration</gray>'
    - '%prefix% <color:#a9c8ff>/jester debug <player></color> <white>—</white> <gray>Toggle debug mode for player</gray>'
    - '%prefix% <color:#a9c8ff>/jester list</color> <white>—</white> <gray>List tracked players</gray>'
    - '%prefix% <color:#a9c8ff>/jester version</color> <white>—</white> <gray>Plugin version info</gray>'
    - '%prefix% <color:#c19a6b>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</color>'

# ─────────────────────────────────────────────────────────────────────────────
# Alert hover — the tooltip shown when staff hover over a flag message.
# This is a LIST: delete a line to drop that row, reorder them, or add your own.
# An empty string '' renders as a blank separator line.
# Placeholders: %player% %brand% %client_version% %check_name% %vl% %max_vl%
#               %ping% %tps% %x% %y% %z% %gamemode% %info% %verbose%
# %info% is a generated, per-flag explanation of WHY this specific flag fired
# (it reads the verbose data, ping and TPS) — the text itself is built in code,
# but you control whether and where the line appears.
# ─────────────────────────────────────────────────────────────────────────────
alert-hover:
    - '<color:#c19a6b>•</color> <white>Player:</white> <color:#a9c8ff>%player%</color>'
    - '<color:#c19a6b>•</color> <white>Brand:</white> <color:#a9c8ff>%brand%</color> <color:#c19a6b>(%client_version%)</color>'
    - '<color:#c19a6b>•</color> <white>Check:</white> <color:#ff5348>%check_name%</color>'
    - '<color:#c19a6b>•</color> <white>Violations:</white> <color:#ff5348>x%vl%</color> <white>/</white> <color:#c19a6b>%max_vl%</color>'
    - '<color:#c19a6b>•</color> <white>Ping:</white> <color:#c19a6b>%ping%ms</color>  <white>TPS:</white> <color:#c19a6b>%tps%</color>'
    - '<color:#c19a6b>•</color> <white>Position:</white> <color:#a9c8ff>%x%, %y%, %z%</color> <dark_gray>(</dark_gray><color:#a9c8ff>%gamemode%</color><dark_gray>)</dark_gray>'
    - ''
    - '<white>Info:</white> <color:#a9c8ff>%info%</color>'
    - '<white>Verbose:</white> <color:#a9c8ff>%verbose%</color>'
    - ''
    - '<color:#c19a6b>•</color> <white>Click to teleport</white>'
