            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6b%check%&8 &7ping: %ping%ms&8)'

    # Impossible resource pack status.
    ResourcePackState:
        enabled: true
        punishable: false
        max-violations: 20
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6b%check%&8 &7ping: %ping%ms&8)'

    # Skipped transaction replies. Usually packet loss, so alert only.
    TransactionOrder:
        enabled: true
        punishable: false
        max-violations: 20
        alert-interval: 1
        dont-alert-until: 5
        alert-cooldown-ms: 2000
        minimum-tps: 19.5
        punishment-commands: []

# ----------------------------------------------------------------------------
#  Check settings
# ----------------------------------------------------------------------------
# Finer settings for single checks. The on/off, punish and alert settings
# for each check are in its block under checks: above.

# ── Movement prediction ───────────────────────────────────────────────────────

MovementA:
    buildup-keep-ratio: 0.999
    # How far (blocks) a move may differ from the prediction before it counts.
    # Slabs, chests and version translation cause small, harmless differences;
    # real fly and speed hacks sit far above this, usually 0.1 or more.
    min-offset: 0.04
    # Used instead while sneaking. Sneaking along block edges is noisy, and
    # nobody gains anything from a hack while sneaking.
    min-offset-sneak: 0.04
    # Used instead on carpet, whose very thin hitbox causes small differences.
    min-offset-carpet: 0.03
    # Used instead on beds (odd hitbox, same kind of noise).
    min-offset-bed: 0.035
    # Used instead in water, the hardest movement to predict exactly.
    min-offset-water: 0.04
    # A single move this far off is set back straight away.
    instant-rubberband-offset: 0.1
    # Above this ping, allow lag-grace-per-ms extra blocks of difference per ms.
    lag-grace-start-ms: 60
    lag-grace-per-ms: 0.00005
    # How much difference may build up before a setback, so one odd tick on a
    # slab doesn't rubber-band anyone.
    rubberband-after-buildup: 3
    buildup-limit: 4
    rubberband-after-vl: 1
    # Ignore differences this long (ms) after /fly is toggled. Raise it if your
    # fly plugin is slow to sync.
    fly-toggle-grace-ms: 1000
    # Violations removed per second. Harmless one-off differences fade quickly;
    # a hack flags every tick and still climbs.
    clear-per-second: 1.0

Phase:
    rubberband-at: 1
    clear-per-second: 0.005

# ── Movement ──────────────────────────────────────────────────────────────────

# Only jumps off a real ledge count, not jumps up a slope or steps.
AutoParkour:
    # How close to the edge (0-1 of the block) a jump has to be.
    edge-threshold: 0.75
    # Jumps looked at together.
    window-size: 14
    # Share of them that have to be edge jumps.
    min-edge-ratio: 0.93
    # Slower than this (blocks per tick) isn't parkour.
    min-speed-bps: 0.15

# Fly: in the air, not falling, nothing holding the player up.
Fly:
    # Ticks of not falling before a flag. 40 = 2 seconds.
    min-air-ticks: 40
    # Dropping at least this much per tick counts as falling.
    falling-threshold: -0.05
    # How far below the player to look for something they could stand on.
    support-search-depth: 3.0

NoJumpDelay:
    # Jumping again sooner than this (ms) after landing counts.
    max-gap-ms: 150
    # That many jumps in a row before a flag.
    min-consecutive: 6

NoSlow:
    # A real no-slow keeps near full speed while eating or blocking (0.15 blocks
    # a tick or more). Lag gives small, scattered differences below this.
    min-offset: 0.05
    rubberband-at: 5
    # Violations removed per second, so stray lag doesn't add up.
    clear-per-second: 0.3

# ── Timer ─────────────────────────────────────────────────────────────────────

PacketLimit:
    # Same as TimerA.max-behind-ms.
    max-behind-ms: 250.0
    clear-per-second: 0.5
    # Above this ping (ms), stop crediting a player for falling behind, so high
    # ping can't be abused. Set with a proxy's extra latency in mind.
    high-ping-cap-ms: 2000

# Timer: a game clock running faster than real time. The block under
# checks: is called TimerA as well.
TimerA:
    # How far (ms) a player's clock may fall behind real time. Proxies and
    # version translation bunch packets up, so be generous. Running ahead,
    # which is what a timer hack does, is caught either way.
    max-behind-ms: 250.0
    # Violations removed per second.
    clear-per-second: 0.5

# ── Knockback ─────────────────────────────────────────────────────────────────

Explosion:
    # How far explosion knockback may differ from the prediction.
    threshold: 0.00001

Knockback:
    buildup-keep-ratio: 0.999
    min-offset: 0.001
    instant-rubberband-offset: 0.1
    # How much difference may build up before a setback (-1 = no limit).
    rubberband-after-buildup: 1.0
    # Upper limit for that build-up.
    buildup-limit: 4.0

# ── Combat ────────────────────────────────────────────────────────────────────

AnchorAura:
    # Respawn anchor uses per second.
    max-per-second: 8

AttributeSwap:
    # Full swaps (slot A to B, hit, back to A) in a row before a flag. Any
    # normal hit resets the count.
    min-consecutive: 4
    # How quickly the swap back has to happen. Raising it starts to catch normal
    # weapon changes.
    max-return-ticks: 1

AutoBlock:
    # Attacks while blocking, in a row, before a flag.
    min-consecutive: 2
    # Skip above this ping (ms).
    max-ping: 500

AutoClickerA:
    # Clicks per second that are flagged straight away. Butterfly and drag
    # clicking go past 20, so leave room.
    max-cps: 40.0
    # Below this spread between clicks, the clicking is too regular for a hand.
    min-cv: 0.10
    # Clicks looked at together.
    window-size: 20
    # Windows over max-cps in a row before a flag.
    min-consecutive-cps: 2
    # Cancel the player's hits for cancel-duration-ms first instead of kicking
    # straight away. Someone clicking fast stops and the violations fade; a
    # macro keeps going and gets kicked.
    cancel-before-kick: true
    cancel-duration-ms: 3000

AutoClickerB:
    # Violations removed per second, so a shaky connection doesn't add up.
    clear-per-second: 1.0
    # Several swings in one tick, this many times within burst-window-ms,
    # before a flag.
    min-bursts: 6
    burst-window-ms: 4000
    # Same as AutoClickerA.
    cancel-before-kick: true
    cancel-duration-ms: 3000

# AutoClickerC: attacking for minutes while completely still (AFK farm
# macros). A weighted mouse button looks the same.
AutoClickerC:
    # Ticks without any movement or turning first. 6000 = 5 minutes.
    min-stationary-ticks: 6000
    # Attacks during that time before the first flag.
    min-attacks: 40
    # Flag again every this many attacks.
    reflag-every-attacks: 20

# AutoClickerD: slow or randomised clicking, judged over minutes.
AutoClickerD:
    # Gaps between attacks looked at together. 60 at ~4 s each is ~4 minutes.
    window-size: 60
    # Only gaps in this range count. Faster is AutoClickerA's job; longer
    # means the player stopped for a while.
    min-interval-ms: 200
    max-interval-ms: 30000
    # A macro reads below this. People are around 0.25-0.50.
    max-cv: 0.12
    # Longest gap divided by the typical one. People sometimes pause; random
    # delays in a macro don't.
    max-tail-ratio: 1.6
    # Humans are lopsided (a few long gaps); around 1.0 is too even.
    symmetry-low: 0.7
    symmetry-high: 1.3
    # How many of the three signs have to agree, over how many windows.
    min-machine-stats: 2
    min-consecutive-windows: 2

AutoPot:
    # Violations removed per second.
    clear-per-second: 0.05
    # That many instant reactions in a row before a flag.
    min-consecutive: 3
    # Using a potion faster than this (ms) after taking damage counts.
    min-react-ms: 80

AutoTotem:
    # Putting a new totem in the off hand faster than this (ms, ping removed)
    # after one pops counts.
    min-react-ms: 150
    # That many times in a row before a flag.
    min-consecutive: 2

AutoWeapon:
    # Switching weapon and hitting in the same tick, that many times in a row.
    min-consecutive: 6

BedAura:
    # Bed placements per second with a bed in the main hand.
    max-per-second: 8

Criticals:
    # Violations removed per second. The ground check occasionally disagrees
    # for real players; a crit hack flags on nearly every hit.
    clear-per-second: 0.05
    # Skip above this ping (ms).
    max-ping: 500

CrystalAura:
    # Violations removed per second.
    clear-per-second: 0.05
    # Crystal hits per second. Good crystal PvP players reach 12-16.
    max-ips: 16
    # Placing and hitting a crystal faster than this (and faster than half the
    # player's ping) means the client hit a crystal it couldn't see yet.
    min-place-detonate-ms: 50
    # That many times in a row before a flag.
    min-consecutive: 3

FastBow:
    # Shortest bow draw (ms) before a release counts.
    min-charge-ms: 45

FastUse:
    # Shortest time (ms) to finish eating or drinking.
    min-use-ms: 1500

KillAuraB:
    # Different entities hit in one tick before a flag. Vanilla can only hit one.
    min-targets: 2

KillAuraC:
    # Hits in a row with a container open before a flag. One hit can be sent
    # just as the container opens.
    min-consecutive: 2

KillAuraD:
    # How far (degrees) the target may be from where the player looks.
    # Moving targets are tracked a little late, so keep it high.
    max-angle-deg: 135.0
    # Skip above this ping (ms).
    max-ping: 300
    # That many hits in a row before a flag.
    min-consecutive: 3

Multitask:
    # Violations removed per second.
    clear-per-second: 0.05
    # Attacks while using an item, in a row, before a flag.
    min-consecutive: 4

NoHitDelay:
    # Attacks in one client tick that count as a bad tick. Vanilla can
    # occasionally fit two.
    max-per-tick: 3
    # Bad ticks in a row before a flag.
    min-consecutive: 2

# Reach. threshold is extra hitbox margin in blocks; real reach hacks are
# 3.3 blocks or more.
Reach:
    block-impossible-hits: true
    # Check again at the end of the tick. A little stricter; off is fine.
    enable-post-packet: false
    threshold: 0.05
    # Blocks allowed on top of the vanilla 3.0.
    extra-reach: 0.3
    # Extra margin while sneaking; the lower eye height arrives a tick late.
    sneak-lenience: 0.1

# ReachB tracks entities itself. A hit counts when the distance is above
# max-reach + base-lenience + ping x ping-lenience-per-ms, min-consecutive times.
ReachB:
    max-reach: 3.4
    hitbox-pad: 0.30
    base-lenience: 0.30
    ping-lenience-per-ms: 0.003
    min-consecutive: 4
    # Ignore hits for this long (ms) after the player takes knockback.
    knockback-grace-ms: 600
    # Farther than this is a tracking glitch, not reach.
    max-plausible-distance: 10.0

# No real client moves more than about 4 blocks in one packet. A hit within
# window-ms of a longer move (max-move) without a server teleport is
# cancelled and flagged.
TeleportHit:
    max-move: 8.0
    window-ms: 150

# A hit counts when it lands within max-acquire-ticks of the crosshair
# reaching the target. People need 3-5 ticks.
TriggerBot:
    max-acquire-ticks: 1
    min-consecutive: 5
    max-ping: 400

# ── Aim ───────────────────────────────────────────────────────────────────────

# AimA currently never flags: its maths can't produce a violation. Kept so
# the settings stay in place.
AimA:
    min-consecutive: 15
    combat-window-ticks: 40

# ── Placing blocks ────────────────────────────────────────────────────────────

FastPlace:
    # Cancel placements from this violation level on. 0 = never.
    cancelVL: 0
    # Blocks per second. Fast bridging reaches 12-15; scaffold hacks go well past
    # this. Scaffolding is not counted.
    max-bps: 16

GhostBlock:
    # Placing against a block the server doesn't have, in a row, before a flag.
    min-consecutive: 2

ScaffoldGoDown:
    # Cancel placements from this violation level on. 0 = never.
    cancelVL: 0
    # Longest gap (ms) between two steps of a downward staircase.
    max-interval-ms: 250
    # Steps in a row before a flag. Good players manage short runs.
    min-consecutive: 6

Tower:
    # Cancel placements from this violation level on. 0 = never.
    cancelVL: 0
    # Placing under yourself while jumping faster than this (ms) counts.
    min-interval-ms: 100
    # That many times in a row before a flag.
    min-consecutive: 2

# ── Breaking blocks ───────────────────────────────────────────────────────────

AutoTool:
    # Switching item this soon (ms) before starting to mine counts.
    switch-ms: 50
    # That many times in a row before a flag.
    min-consecutive: 3

FastBreak:
    # How much faster than the calculated break time is allowed. 2.0 = twice as
    # fast. Raise it if custom enchants still get flagged; lower it towards 1.0
    # on a vanilla server.
    speed-tolerance: 3.0

# Raise these if you use area-breaking enchants (CrazyEnchantments Blast and
# the like). Their extra breaks don't show in the packets and look like nuking.
NukerA:
    # Finished breaks allowed within window-seconds.
    max-breaks-per-window: 15
    window-seconds: 3
    # Different blocks started in one client tick.
    max-simultaneous: 3

NukerB:
    # Three breaks within half a second spread wider than this around the
    # player count as nuking. Blocks right at the player's feet are ignored.
    max-span-degrees: 120.0
    max-creative-bps: 8

PacketMine:
    # Start and finish of a break closer than this (ms) counts as instant.
    max-instant-ms: 30
    # That many instant breaks in a row before a flag.
    min-consecutive: 3

VeinMiner:
    # Violations removed per second.
    clear-per-second: 0.05
    # Finished block breaks per second. Vanilla tops out around 3.3.
    max-bps: 5

# ── Player and inventory ──────────────────────────────────────────────────────

AutoArmor:
    # Time window (ms) for putting armor on.
    max-burst-ms: 200
    # Different armor slots filled within that window before a flag. Taking
    # armor off doesn't count.
    burst-threshold: 4

AutoEat:
    # Eating faster than this (ms) after the hunger bar drops counts.
    min-react-ms: 100
    # That many times in a row before a flag.
    min-consecutive: 5

AutoFish:
    # Reeling in faster than this after a bite counts. Includes the round trip.
    min-react-ms: 150

AutoRespawn:
    # Respawning faster than this after dying counts. Vanilla keeps the button
    # disabled for a full second.
    min-respawn-ms: 300

ChestStealer:
    # Container clicks per second.
    max-cps: 22
    # Shortest gap (ms) between two container clicks.
    min-interval-ms: 40
    # Different slots emptied in one burst before a flag.
    burst-threshold: 8

GhostItem:
    min-consecutive: 2
    # Skip above this ping (ms).
    max-ping: 600

InventoryWalk:
    # Slower than this (blocks per tick) is leftover sliding, not walking.
    min-speed: 0.10
    # Ticks of walking with a container open before a flag and setback.
    min-consecutive: 6

# ── Elytra ────────────────────────────────────────────────────────────────────

# Flags rocket use while gliding that is timed like a machine. Holding
# right-click (one rocket every 200 ms) is left alone.
FireworkBoost:
    window-size: 8
    max-cv: 0.06
    max-interval-ms: 1200

# ── Vehicles ──────────────────────────────────────────────────────────────────

BoatClip:
    # Longest vehicle move per packet (blocks). Blue ice racing reaches ~3.5.
    max-delta: 5.0
    # That many in a row before a flag.
    min-consecutive: 2

BoatFly:
    # Ticks of a boat climbing through the air before a flag. A boat thrown by
    # an explosion slows down every tick and doesn't count.
    min-rise-ticks: 15
    # Blocks climbed in that time.
    min-rise: 3.0

EntityFly:
    # Ticks of a mount climbing without slowing down. A jump always slows down,
    # so it can't count.
    min-rise-ticks: 25
    # Blocks climbed in that time.
    min-rise: 4.0

# Mount and boat speed in blocks per tick (x20 for blocks per second).
EntitySpeed:
    # Normal ground. A boat on water tops out near 0.4, a fast horse near 0.67.
    max-speed: 0.85
    # Used on ice instead. Ice boats are very fast.
    ice-max-speed: 4.0
    # Ticks over the limit before a flag. Ticks where the speed is dropping
    # (a camel dash, knockback) don't count.
    min-consecutive: 6
    # Jumps bigger than this are teleports, not travel.
    ignore-above: 8.0

# ── Sprint ────────────────────────────────────────────────────────────────────

# Violations removed per second.
SprintA: { clear-per-second: 0.5 }
SprintB: { clear-per-second: 0.5 }
SprintC: { clear-per-second: 0.5 }
SprintD: { clear-per-second: 0.5 }
SprintE: { clear-per-second: 0.5 }
SprintF: { clear-per-second: 0.5 }
SprintG: { clear-per-second: 0.5 }

# ── Doing two things at once ──────────────────────────────────────────────────

# Violations removed per second.
MultiActionsA: { clear-per-second: 0.5 }
MultiActionsB: { clear-per-second: 0.5 }
MultiActionsC: { clear-per-second: 0.5 }
MultiActionsD: { clear-per-second: 0.5 }
MultiActionsE: { clear-per-second: 0.5 }
MultiActionsF: { clear-per-second: 0.5 }
MultiActionsG: { clear-per-second: 0.5 }

# ── Packet order ──────────────────────────────────────────────────────────────

PacketOrderI:
    # Turn on if players using 1.7 animation mods get flagged.
    exempt-placing-while-digging: false

# ----------------------------------------------------------------------------
#  Engine settings
# ----------------------------------------------------------------------------
# The defaults suit almost every server.

exploit:
    # false blocks the extra speed from sprint jumping with an elytra on.
    allow-sprint-jumping-when-using-elytra: true
    # Let players build against blocks their client shows but the server
    # doesn't have.
    allow-building-on-ghostblocks: true
    # How far around the player to look for those (2-4).
    distance-to-check-for-ghostblocks: 2

# Turn off the built-in block resync after setbacks. Only if another plugin
# does it.
disable-default-resync-handler: false

# Drop the extra position packet 1.17+ clients send when using an item.
cancel-duplicate-packet: true

# Ignore the rotation in that extra packet.
ignore-duplicate-packet-rotation: false

# Client brand alerts. Brands matching ignored-clients are not announced.
client-brand:
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Kick Forge versions with known exploits.
    disconnect-blacklisted-forge-versions: true

# /jester spectate. hide-regardless hides staff with the spectate permission
# even when they aren't spectating; allowed-worlds limits hiding to those
# worlds (empty = everywhere).
spectators:
    hide-regardless: false
    allowed-worlds:
        - ""

# Kick a player who doesn't answer the anticheat's transactions for this many
# seconds.
max-transaction-time: 60

# The anticheat hides the replies to its own transactions from the server.
# Turn this on only if another plugin needs to see them.
disable-pong-cancelling: false

# Above this ping (ms), don't flag players leaving fly mode.
max-ping-out-of-flying: 1000

# Above this ping (ms), stop predicting firework boosts exactly.
max-ping-firework-boost: 1000

# Packets per tick before a player is kicked for packet spam.
packet-spam-threshold: 100

# Skip movement prediction while gliding. Only for heavily modified elytras.
exempt-elytra: false

# Hold players to vanilla slowdown when using items or sneaking.
force-slow-movement: true

# Hold players to vanilla speed in cobwebs and berry bushes.
force-stuck-speed: true

# Alerts only in the console and no punishments. For testing.
test-mode: false

# Treat item use as finished on these events, like vanilla. Leave on.
reset-item-usage-on-attack: true
reset-item-usage-on-item-update: true
reset-item-usage-on-item-use: true
reset-item-usage-on-slot-change: true

# ----------------------------------------------------------------------------
#  Grouped punishments (old style)
# ----------------------------------------------------------------------------

# Old style grouped punishments. The blocks under checks: already do alerts
# and kicks, so this is only used for [log] entries and any extra commands you
# add. [alert], [proxy] and [webhook] are ignored here.
# Format: <threshold>:<interval> <command>  (interval 0 = once)
Punishments:
    - checks:
          - '!BadPackets'
          - '!Crash'
      remove-violations-after: 300
      commands:
          - '1:1 [alert]'
          - '1:1 [log]'
    - checks:
          - 'BadPackets'
          - 'Crash'
      remove-violations-after: 300
      commands:
          - '1:1 [alert]'
          - '1:0 [log]'
