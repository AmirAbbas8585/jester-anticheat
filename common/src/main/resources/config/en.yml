# ─────────────────────────────────────────────────────────────────────────────
# Check-Specific Fine-Tuning
# These keys are read directly by each check's onReload method.
# ─────────────────────────────────────────────────────────────────────────────

# Reach — simulation-based combat hit distance (entity_interaction_range, 3.0).
# threshold is extra hitbox margin (blocks). 0.0005 is razor-thin and flags
# legit combat near the 3.0 boundary; 0.03 (one movement tick of uncertainty)
# absorbs that while still catching real reach (always 3.3+ blocks).
Reach:
    block-impossible-hits: true
    # Also re-check reach at end of tick (catches a few more blatant cases,
    # slightly stricter — leave off unless you want maximum strictness).
    enable-post-packet: false
    threshold: 0.05
    # Extra blocks of reach allowed on top of vanilla 3.0 before flagging.
    # 0.3 -> effective ~3.3-block limit.
    extra-reach: 0.3
    # Extra reach margin (blocks) while sneaking — the sneak eye-height change is
    # processed a tick late, briefly inflating the measured hit distance. Real
    # reach hacks are 3.3+ blocks, far beyond this.
    sneak-lenience: 0.1

# ReachB — our own reach check (entity tracking + ping rewind). A hit flags when
# eye-to-(padded)-hitbox distance exceeds: max-reach + base-lenience +
# ping*ping-lenience-per-ms, sustained min-consecutive times. Loosen the
# lenience values if legit high-ping PvP flags; tighten to catch smaller reach.
ReachB:
    max-reach: 3.4
    hitbox-pad: 0.30
    base-lenience: 0.30
    ping-lenience-per-ms: 0.003
    min-consecutive: 4
    # Ignore hits for this many ms after the player takes knockback/velocity
    # (e.g. being hit while holding a shield) — position desync inflates reach.
    knockback-grace-ms: 600
    # Distances above this (blocks) are treated as tracking glitches, not reach
    # (no real cheat hits from tens of blocks away) — kills high-ping noise.
    max-plausible-distance: 10.0

# AutoBlock — max ping before the check is skipped (ms)
AutoBlock:
    # Consecutive attack-while-blocking ticks before flagging.
    min-consecutive: 2
    max-ping: 500

# Criticals — max ping before the check is skipped (ms)
Criticals:
    max-ping: 500

# NoHitDelay — attacks counted per client tick (immune to network jitter).
# A vanilla client may rarely fit 2 attacks in one tick; 3+ is a hack.
NoHitDelay:
    # Attacks within one client tick to count as a bad tick
    max-per-tick: 3
    # Consecutive bad ticks before flagging
    min-consecutive: 2

# FastUse — minimum item use duration in ms (vanilla food = 1600ms, potions = 1600ms)
FastUse:
    min-use-ms: 1500

# CrystalAura — only attacks on actual END_CRYSTAL entities count.
# Skilled crystal PvP legitimately reaches 12-16 interactions/sec.
CrystalAura:
    max-ips: 16
    min-place-detonate-ms: 50
    # Consecutive sub-50ms place->detonate cycles before flagging
    min-consecutive: 3

# VeinMiner — max COMPLETED block breaks (FINISHED_DIGGING) per second.
# Clicks and instant-break blocks are not counted.
VeinMiner:
    max-bps: 5

# FastBow — minimum bow charge time in ms before release is valid
FastBow:
    min-charge-ms: 45

# FastPlace — max blocks per second before flagging
# FastPlace — vanilla's 4-tick right-click cooldown caps placements at 5/sec
# regardless of click speed; 10 absorbs network jitter. Meteor FastUse ~20/sec.
FastPlace:
    # Cancel placements at/above this VL (0 = never cancel).
    cancelVL: 0
    # Raised: fast bridging (god-bridge, moonwalk) legitimately places 12-15
    # blocks/sec, so 10 false-flagged fast builders. Scaffold cheats place far
    # more (20+) or perfectly-timed, still well above this.
    max-bps: 16

# Tower — minimum milliseconds between consecutive under-self placements while jumping
Tower:
    # Cancel tower placements at/above this VL (0 = never cancel).
    cancelVL: 0
    min-interval-ms: 100
    # Consecutive too-fast placements before flagging (absorbs network jitter)
    min-consecutive: 2

# InventoryWalk — sustained movement with a container GUI open.
# Momentum slides and knockback die out within a few ticks; held movement keys
# don't. Flagging triggers a setback every tick, neutralizing the cheat.
InventoryWalk:
    # Horizontal blocks/tick below this counts as residual drift, not input
    min-speed: 0.10
    # Consecutive moving ticks (on the ground, not ice) before flag + immediate setback (~300ms)
    min-consecutive: 6

# KillAuraB — attacking multiple distinct entities in one client tick
KillAuraB:
    # Distinct entities hit in one tick before flagging (2 = vanilla-impossible).
    min-targets: 2

# KillAuraC — attacking while a container GUI is open
KillAuraC:
    # Attacks in a row while a container is open before flagging. Prevents a
    # false positive from a single attack that was in-flight when the container
    # opened (a timing race, not a cheat).
    min-consecutive: 2

# KillAuraD — angle threshold for looking away from target
KillAuraD:
    # Entity position tracking lags moving targets — keep this high (135 = clearly behind)
    max-angle-deg: 135.0
    max-ping: 300
    # Consecutive bad-angle attacks required before flagging
    min-consecutive: 3

# NukerA — multi-block / break-rate detection.
# Raise these if you use area-break enchants (e.g. CrazyEnchantments Blast),
# whose extra block breaks the anticheat can't see in the packets and would
# otherwise read as nuking. Defaults match vanilla survival.
NukerA:
    # Max COMPLETED block breaks allowed within window-seconds before flagging.
    max-breaks-per-window: 15
    window-seconds: 3
    # Distinct blocks started in a single client tick before flagging.
    max-simultaneous: 3

# NukerB — direction-span detection thresholds
NukerB:
    max-span-degrees: 120.0
    max-creative-bps: 8

# AutoFish — minimum human reaction time after fish bite
AutoFish:
    min-react-ms: 150

# AutoArmor — burst detection thresholds
AutoArmor:
    # Maximum milliseconds window for counting rapid armor-slot clicks
    max-burst-ms: 200
    # How many DISTINCT armor slots within the window before flagging. Raised to
    # 4: a real auto-armor equips the whole set (all 4 pieces) near-instantly,
    # whereas a player manually equipping fast can click 2-3 slots quickly.
    burst-threshold: 4

Multitask:
    # Consecutive incompatible-action ticks before flagging. 2 false-flagged
    # high-ping players whose packets interleave; 4 needs a sustained pattern.
    min-consecutive: 4

# AutoRespawn — minimum ms between death and respawn packet
AutoRespawn:
    min-respawn-ms: 300

# AutoTool — timing between held-item-change and start-digging
AutoTool:
    # Max ms between HELD_ITEM_CHANGE and START_DIGGING to count as a switch
    switch-ms: 50
    # How many consecutive fast-switch+dig events before flagging
    min-consecutive: 3

# FastBreak — how much faster than vanilla-predicted mining to tolerate.
# This check predicts how long a block SHOULD take to break from vanilla data
# (tool, Efficiency, Haste, attributes). Custom-enchant plugins make players mine
# faster than that prediction — vanilla Efficiency beyond level 5, or
# CrazyEnchantments enchants like Haste/Blast — which would otherwise false-flag.
# 2.0 = allow up to twice the predicted speed. Raise it if custom enchants still
# flag; on a vanilla-only server you can lower it toward 1.0 for stricter checks.
FastBreak:
    # Raised for headroom on high-ping / high-tier tools + enchants so legit
    # fast mining isn't flagged; real instant-break is caught by PacketMine.
    speed-tolerance: 3.0

# PacketMine — instant-break detection (sub-tick start->finish)
PacketMine:
    # Max ms between start-dig and finish-dig to count as instant.
    # Keep below 50 (1 tick) — legit 1-tick breaks arrive ~50ms apart.
    max-instant-ms: 30
    # Consecutive instant breaks before flagging (absorbs TCP packet bunching)
    min-consecutive: 3

# BedAura — maximum bed interactions per second
# Note: right-clicking any block while holding a bed also counts, so this
# must stay above human jitter-click range (~5-7/s)
BedAura:
    max-per-second: 8

# AnchorAura — maximum respawn anchor interactions per second
AnchorAura:
    max-per-second: 8

# AutoPot — minimum human reaction time after taking damage
AutoPot:
    # Consecutive instant-pot patterns before flagging.
    min-consecutive: 3
    min-react-ms: 80

# AutoWeapon — hotbar switch and attack in the SAME client tick, repeatedly.
# A human can scroll+click in one tick occasionally; the cheat does it every attack.
AutoWeapon:
    min-consecutive: 6

# AttributeSwap — the MC-28289 swap exploit (slot A -> B -> attack -> back to A)
AttributeSwap:
    # Complete round trips IN A ROW before flagging. Any attack that isn't part
    # of a round trip resets the count, so normal combat never accumulates.
    # Lower = catches it sooner, but leaves less room for a lucky manual
    # scroll-click-scroll. 4 is already very hard to hit by hand.
    min-consecutive: 4
    # How long the swap BACK may take. The exploit only pays off inside the same
    # tick; 1 allows for a tick boundary landing mid-sequence. Raising this makes
    # ordinary weapon changes start to look like the exploit — don't.
    max-return-ticks: 1

# AutoTotem — offhand totem restock reaction after a pop (ping-compensated)
AutoTotem:
    min-react-ms: 150
    min-consecutive: 2

# AutoEat — minimum human reaction time after a hunger drop. Eating isn't an
# emergency like combat damage, so this needs several consecutive fast
# reactions (min-consecutive) before it's treated as suspicious, not one.
AutoEat:
    min-react-ms: 100
    min-consecutive: 5

# AimA — aimbot GCD analysis. Rotations during combat must be multiples of the
# mouse sensitivity step; computed rotations (aimbot) have no common divisor.
AimA:
    # Unquantized significant rotations in a row before flagging
    min-consecutive: 15
    # Only judge rotations within this many ticks after an attack
    combat-window-ticks: 40

# TriggerBot — attack arriving within max-acquire-ticks of the crosshair
# landing on the target, min-consecutive times in a row (humans need 3-5 ticks)
TriggerBot:
    max-acquire-ticks: 1
    min-consecutive: 5
    max-ping: 400

# BoatFly — consecutive ascending vehicle-move packets with no water involved
BoatFly:
    min-rise-ticks: 15
    min-rise: 3.0

# EntityFly — ridden MOB climbing through air (horses/pigs/striders/...)
EntityFly:
    # Consecutive ascending ticks that are NOT decelerating. A jump is a parabola
    # and always decelerates, so it can never build a streak here. The strongest
    # vanilla horse jump is ~5.5 blocks over ~15 decelerating ticks.
    min-rise-ticks: 25
    # Total blocks gained during that streak before flagging.
    min-rise: 4.0

# EntitySpeed — max horizontal speed of a ridden vehicle, in blocks per tick.
# (multiply by 20 for blocks/second: 0.85 -> 17 b/s, 4.0 -> 80 b/s)
EntitySpeed:
    # Normal surfaces. A vanilla boat on water peaks near 0.4 and a fast horse
    # near 0.67, so 0.85 leaves plenty of headroom for jitter.
    max-speed: 0.85
    # Used instead when ice/packed ice/blue ice is under the vehicle. Ice-boat
    # travel is legitimately extremely fast — keep this generous.
    ice-max-speed: 4.0
    # Consecutive over-limit ticks required. Lag bunches packets into ONE big
    # delta, not a run of them, so this is the main false-positive guard.
    min-consecutive: 6
    # Deltas above this are teleports/chunk-load jumps, not travel — ignored
    # here (BoatClip is the check that bounds those).
    ignore-above: 8.0

# BoatClip — max legitimate vehicle movement per packet (blue-ice racing ~3.5)
BoatClip:
    max-delta: 5.0
    min-consecutive: 2

# FireworkBoost — interval uniformity (CV) of rocket boosts while gliding.
# Human spam clicking has CV > 0.1; macros sit near 0.
FireworkBoost:
    window-size: 8
    max-cv: 0.06
    max-interval-ms: 1200

# NoJumpDelay — consecutive instant re-jump detection.
# A single fast re-jump is vanilla-possible (tapping jump on landing);
# the cheat re-jumps instantly on EVERY landing.

# Fly — airborne without falling, judged independently of the prediction engine.
# MovementA can only catch flight through prediction error, and its offset bar
# has to stay loose enough not to flag real players. This check instead uses a
# rule no fly implementation can avoid: an unsupported airborne player must fall.
Fly:
    # Consecutive ticks of "not descending" while unsupported before flagging.
    # 40 = 2 seconds. A ballistic arc (explosion, slime block, fishing rod) turns
    # into a fall within ~12 ticks, so it can never reach this.
    min-air-ticks: 40
    # Per-tick change in Y that counts as genuinely falling and clears the streak.
    # Vanilla free-fall passes this within a tick or two of leaving the ground.
    falling-threshold: -0.05
    # How far below the player to look for something holding them up. Generous on
    # purpose — the goal is to never flag someone the server merely THINKS is
    # airborne (desynced block, ghost block, collision edge case).
    support-search-depth: 3.0
NoJumpDelay:
    # Land->jump gap below this counts toward the streak
    max-gap-ms: 150
    # Consecutive fast re-jumps before flagging
    min-consecutive: 6

# AutoParkour — edge-jump detection thresholds
AutoParkour:
    # Fraction of block depth (0-1) considered an "edge jump" (0.75 = last 25%)
    edge-threshold: 0.75
    # Number of jumps in the rolling analysis window (bigger = harder to false)
    window-size: 14
    # Fraction of window that must be edge-jumps to flag (0.93 ≈ 13/14).
    # A human, even a great parkour player, has more variance than this.
    min-edge-ratio: 0.93
    # Minimum horizontal speed (blocks/tick) to be considered parkour
    min-speed-bps: 0.15

# ScaffoldGoDown — descending staircase placement thresholds
ScaffoldGoDown:
    # Cancel placements at/above this VL (0 = never cancel).
    cancelVL: 0
    # Maximum ms between consecutive staircase placements
    max-interval-ms: 250
    # How many consecutive downward placements before flagging
    # (skilled manual down-bridgers can sustain short bursts — keep >= 6)
    min-consecutive: 6

ChestStealer:
    # Clicks per second in a container above which stealing is flagged.
    max-cps: 22
    # Minimum ms between two container clicks (below = inhuman).
    min-interval-ms: 40
    # Distinct slots looted in one burst before flagging.
    burst-threshold: 8



Explosion:
    # Offset tolerance for explosion knockback mispredictions.
    threshold: 0.00001




# AutoClickerA — click consistency analysis thresholds
AutoClickerA:
    # Maximum physically possible CPS; above this is flagged immediately.
    # 20.0 is the exact vanilla tick-rate ceiling (1 click/tick) with NO margin
    # for packet-timestamp jitter — a real log showed a legit player averaging
    # 49.8ms over a full 20-click window (cps=20.1), i.e. clicking essentially
    # exactly on every tick. Vanilla doesn't even register extra hits above
    # 20/sec anyway, so there's no exploit value between 20-21; raised to give
    # genuine max-speed clickers room without weakening detection of real
    # macros (which run well above this, e.g. 25-30+ CPS).
    # Raised: butterfly/drag/jitter clicking are legitimate techniques that
    # easily exceed 21 CPS, so a low ceiling false-flags fast human clickers.
    # Real auto-clickers are caught by consistency (min-cv) below, not raw speed.
    max-cps: 40.0
    # Minimum coefficient of variation for human clicks (lower = auto-clicker)
    min-cv: 0.10
    # Rolling window of click intervals used for analysis
    window-size: 20
    # How many consecutive analysis windows must exceed max-cps before a CPS
    # violation counts — absorbs a single borderline window from a max-speed
    # human clicker sitting right on the vanilla tick ceiling.
    min-consecutive-cps: 2
    # Cancel-before-kick: instead of kicking the moment an auto-clicker is
    # detected, first NEUTRALISE it — the player's attack packets are silently
    # cancelled for cancel-duration-ms (their clicks land on nothing). A legit
    # borderline-fast clicker stops, the violations decay, and no kick happens. A
    # real macro keeps clicking through the dead window, keeps flagging, reaches
    # max-violations and only THEN gets kicked. Set cancel-before-kick:false to
    # go straight back to kicking on threshold.
    cancel-before-kick: true
    cancel-duration-ms: 3000


# AutoClickerC — AFK farm autoclicker (idle + attacking)
AutoClickerC:
    # Ticks the player must be COMPLETELY frozen (position, yaw and pitch all
    # bit-identical) before any attack counts. 6000 = 5 minutes. Any real input
    # at all resets it — this is about proving the input is mechanical.
    min-stationary-ticks: 6000
    # Attacks landed while frozen before the first flag.
    min-attacks: 40
    # Flag again every N further attacks while it continues.
    reflag-every-attacks: 20

# AutoClickerD — slow / randomised autoclicker, judged over minutes
AutoClickerD:
    # Attack intervals per window. 60 at ~4s each is about 4 minutes of evidence.
    # Below ~30 the tail test has no statistical power and will misjudge humans.
    window-size: 60
    # Only intervals inside this band are analysed. Faster is AutoClickerA's job;
    # slower means the player stopped and came back, which would inject a fake
    # "human" long tail into the window.
    min-interval-ms: 200
    max-interval-ms: 30000
    # A machine reads BELOW this. Fixed macro ~0.00; +/-500ms jitter on 4s ~0.07;
    # humans 0.25-0.50.
    max-cv: 0.12
    # max/median. Humans get distracted and produce one long gap; bounded jitter
    # cannot. This is the statistic that actually defeats randomisation.
    max-tail-ratio: 1.6
    # (p90-p50)/(p50-p10). Symmetric ~1.0 means machine; humans are right-skewed.
    symmetry-low: 0.7
    symmetry-high: 1.3
    # How many of the three must read as machine, and over how many consecutive
    # windows. 2 and 2 means roughly eight minutes of agreeing evidence.
    min-machine-stats: 2
    min-consecutive-windows: 2

AutoClickerB:
    # Violations removed per second while not flagging. Kept high so a jittery
    # connection (e.g. a mobile client) that occasionally produces the
    # multi-swing-in-one-tick pattern clears between incidents instead of slowly
    # creeping toward a kick over a whole session.
    clear-per-second: 1.0
    # Number of multi-swing-in-one-tick bursts within burst-window-ms before a
    # violation is counted (a single coincidental burst is network noise, a real
    # macro does it repeatedly).
    min-bursts: 6
    burst-window-ms: 4000
    # Cancel-before-kick (see AutoClickerA): neutralise the extra swings for a
    # few seconds before any kick can happen.
    cancel-before-kick: true
    cancel-duration-ms: 3000

# Exploit toggles
exploit:
    allow-sprint-jumping-when-using-elytra: true
    # Allow players to build against client-side ghost blocks (true = fewer
    # false block-place rejections); scan distance for them is 2-4.
    allow-building-on-ghostblocks: true
    distance-to-check-for-ghostblocks: 2

# ─────────────────────────────────────────────────────────────────────────────
# Legacy grouped punishments. The per-check "checks:" blocks above already drive
# alerts and kicks, so this section is optional and only used for [log] history
# entries and any extra grouped commands you choose to add here. [alert]/[proxy]/
# [webhook] entries are ignored here to avoid duplicate alerts.
# Format per command:  <threshold>:<interval> <command>   (interval 0 = once)
# ─────────────────────────────────────────────────────────────────────────────
Punishments:
    - checks:
          - '!BadPackets'
          - '!Crash'
      remove-violations-after: 300
      commands:
          - '1:1 [alert]'
          - '1:1 [log]'

    - checks:
          - 'BadPackets'
          - 'Crash'
      remove-violations-after: 300
      commands:
          - '1:1 [alert]'
          - '1:0 [log]'

# Setback block resync (fix ghost blocks)
disable-default-resync-handler: false
cancel-duplicate-packet: true
ignore-duplicate-packet-rotation: false

# Client brand alerts
client-brand:
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    disconnect-blacklisted-forge-versions: true

spectators:
    hide-regardless: false
    allowed-worlds:
        - ""

max-transaction-time: 60
disable-pong-cancelling: false


# GhostBlock — placing against a block that is air server-side (ghost-block abuse)
GhostBlock:
    # Placements-against-air in a row before flagging (a same-tick break desync
    # can look like one, so require a short streak).
    min-consecutive: 2

# GhostItem — using an item the server doesn't see in the player's hand
GhostItem:
    min-consecutive: 2
    # Skip above this ping (ms) — inventory desync grows with latency.
    max-ping: 600

#  ◆────────────────────────────────────────────────────────────────────────◆
#    ADVANCED  ·  engine internals — the defaults are right for most servers
#  ◆────────────────────────────────────────────────────────────────────────◆
# Above this ping (ms), don't flag players leaving fly mode (ability desync).
max-ping-out-of-flying: 1000
# Above this ping (ms), give up predicting firework elytra boosts exactly.
max-ping-firework-boost: 1000
# Packets per tick from one player before they're treated as a packet-spam
# attack (kicked). Raise only if a legit mod legitimately bursts packets.
packet-spam-threshold: 100
# Exempt elytra flight from prediction entirely (weakens detection — only for
# servers with heavily modified elytra physics).
exempt-elytra: false
# Enforce vanilla slow movement while using items / sneaking via prediction.
force-slow-movement: true
# Enforce vanilla stuck-speed (cobweb, sweet berry) via prediction.
force-stuck-speed: true
# Test mode: alerts print to console only, punishments disabled (for staging).
test-mode: false
# Ghost-block mitigation: allow players to build against client-side ghost
# blocks (true = fewer false block-place rejections), and how far around the
# player to scan for them (2-4).
# Reset item-usage state on these events (vanilla parity — leave on).
reset-item-usage-on-attack: true
reset-item-usage-on-item-update: true
reset-item-usage-on-item-use: true
reset-item-usage-on-slot-change: true

# ─────────────────────────────────────────────────────────────────────────────
# Sprint* / MultiActions* — violation decay.
# These upstream checks flag on a single tick and carry no streak, ping or lag
# guard of their own, so packet-ordering artefacts do produce occasional
# violations. clear-per-second is now applied on a timer (see ViolationDecayer),
# so a generous rate here means isolated noise disappears within a few seconds
# while a real cheat, which flags continuously, still climbs to its threshold.
# ─────────────────────────────────────────────────────────────────────────────
SprintA:  { clear-per-second: 0.5 }
SprintB:  { clear-per-second: 0.5 }
SprintC:  { clear-per-second: 0.5 }
SprintD:  { clear-per-second: 0.5 }
SprintE:  { clear-per-second: 0.5 }
SprintF:  { clear-per-second: 0.5 }
SprintG:  { clear-per-second: 0.5 }
MultiActionsA: { clear-per-second: 0.5 }
MultiActionsB: { clear-per-second: 0.5 }
MultiActionsC: { clear-per-second: 0.5 }
MultiActionsD: { clear-per-second: 0.5 }
MultiActionsE: { clear-per-second: 0.5 }
MultiActionsF: { clear-per-second: 0.5 }
MultiActionsG: { clear-per-second: 0.5 }
