# Jester AntiCheat
#
# Every check has a block under "checks:" where you switch it on or off, decide
# whether it may punish, and set the command it runs. Anything a check leaves
# out comes from "alert-defaults". Colours take &a codes and &#rrggbb hex.
# Run /jester reload after editing.

# Used by the plugin to update this file after an upgrade. Don't change it.
config-version: 4

# ----------------------------------------------------------------------------
#  Alerts
# ----------------------------------------------------------------------------

# Put in front of every message from the plugin.
prefix: '&#c19a6bᴊᴇꜱᴛᴇʀ &8»'

alerts:
    # Print alerts in the console as well.
    print-to-console: true
    # Click an alert in chat to teleport to the player.
    clickable: true
    # Placeholders: %player% %check_name% %vl% %verbose% %ping% %tps% %version%
    format: '%prefix% &#c19a6b%player% &fhas failed &#c19a6b%check_name% &8[&#c19a6bx%vl% &8| &#c19a6b%ping%ms&8]'
    # The console version of the alert.
    console-format: '&8[&#c19a6bᴊ&8] %player% failed %check_name% (x%vl%) | %verbose%'
    # On a BungeeCord/Velocity network: send this server's alerts to the other
    # servers running Jester, and show theirs here. Detected from spigot.yml or
    # paper-global.yml.
    network:
        send: true
        receive: true
    # Print every single flag in the console too. Very noisy.
    verbose-to-console: false

# Staff with jester.alerts get alerts switched on when they join. Set to
# false if they should switch them on with /jester alerts.
toggle-alerts-on-join: true

# ----------------------------------------------------------------------------
#  When checks run and punish
# ----------------------------------------------------------------------------

# Movement checks wait this long (ms) after a player joins: they may spawn in
# mid-air or with chunks still loading. Waiting for a resource pack is
# covered on its own, up to 30 seconds.
movement-grace:
    join-ms: 3000

# Beta checks are newer or less proven: most of the BadPackets, Sprint,
# Elytra, Vehicle, MultiActions and PacketOrder checks. With this on they run
# and alert. Whether they can punish is the next option.
beta-checks: true

# Let beta checks kick or ban. Leave this off until you have watched a check
# on your own server and trust it.
beta-checks-punishable: false

# Above this ping (ms) checks still alert but won't punish, so nobody gets
# kicked for lag. BadPackets, Crash and Exploit ignore it. 0 turns it off.
high-ping:
    no-punish-above-ms: 400

# Used by every check for anything it doesn't set in its own block.
alert-defaults:
    # Alert on every Nth violation. 1 = every one.
    alert-interval: 1
    # Stay quiet until the player has this many violations.
    dont-alert-until: 3
    # Shortest gap between two alerts for the same player and check.
    alert-cooldown-ms: 1000
    # Below this TPS a check stops completely: no violations, no alerts, no
    # logs. Someone cheating in that time looks clean, so keep it low. The
    # console warns you when it happens. BadPackets, Crash and Exploit use 0
    # and never stop.
    minimum-tps: 15.0
    # Violations before the punishment runs.
    max-violations: 20
    # Whether checks may punish at all, unless their own block says otherwise.
    punishable: true
    # The violations have to keep coming for at least this long before a
    # punishment runs, so a short lag burst can't kick someone in a split
    # second. 0 = punish as soon as max-violations is reached.
    punish-grace-ms: 2000

# ----------------------------------------------------------------------------
#  Storage
# ----------------------------------------------------------------------------

# One database for everything, including /jester history. SQLite needs no
# setup (plugins/JesterAntiCheat/jester.db). Use mysql if a website or another
# server needs to read it.
#
# Tables:
#   jester_violations   every flag with ping and TPS, cleared after
#                       violation-retention-hours
#   jester_punishments  every punishment, kept
#   jester_profiles     name, client version and brand per player
#   jester_history_*    /jester history, kept
database:
    enabled: true
    type: sqlite          # sqlite or mysql
    host: localhost
    port: 3306
    database: jester
    username: root
    password: ''
    pool-size: 5
    # At most one row per player and check in this time (ms). The vl column
    # keeps counting, so nothing is lost.
    log-throttle-ms: 2000
    # How long jester_violations keeps rows. Nothing else is ever cleared.
    violation-retention-hours: 6

# /jester history. It uses the database above; this switch is separate from
# database.enabled, which only covers jester_violations.
history:
    enabled: true
    entries-per-page: 15
    # Shown on each entry. Handy when several servers share one MySQL.
    server-name: 'server'

# ----------------------------------------------------------------------------
#  Bedrock players
# ----------------------------------------------------------------------------

# Bedrock players (Geyser/Floodgate) are still checked, but checks that assume
# Java behaviour are skipped for them: movement prediction, knockback, reach
# and aim (Geyser makes up the look direction on touch screens), click timing
# and packet order. Packet validity checks such as Crash and Exploit still
# run, since a normal Bedrock client can't trip them.
#
# Bedrock players are recognised by their Floodgate UUID, or by a client brand
# containing "Geyser" for accounts linked to Java.
bedrock:
    # false = check Bedrock players exactly like Java players.
    enabled: true
    # Leave empty for the built-in list. A list here replaces it completely,
    # it doesn't add to it.
    disabled-checks: []

# ----------------------------------------------------------------------------
#  Other plugins and updates
# ----------------------------------------------------------------------------

# Each option only does something when that plugin is installed, so leaving
# them on is safe. Set one to false to turn that support off.
integrations:
    # GSit: skip movement checks for players sitting, crawling or lying down.
    gsit-exempt-movement: true
    # DeluxeCombat / CrazyEnchantments: allow for their custom knockback.
    deluxecombat-kb-tolerance: true
    # AuraSkills: allow for its speed and jump bonuses.
    auraskills-movement-boost: true
    # WorldGuard: skip flight checks in regions where flying is allowed.
    worldguard-fly-regions: true
    # ItemsAdder: use custom block hardness in FastBreak and Nuker.
    itemsadder-custom-blocks: true

# Looks for a newer version on Modrinth and tells the console and staff.
update-checker:
    enabled: true
    # Check again every this many minutes. 0 = only on startup.
    interval-minutes: 180
    # Players with this permission are told when they join.
    notify-permission: 'jester.update'

# ----------------------------------------------------------------------------
#  AFK
# ----------------------------------------------------------------------------

# Kicks AFK players, but only inside WorldGuard regions you mark:
#   /rg flag <region> jester-afk-blocked allow
# Remove the mark with /rg flag <region> jester-afk-blocked
afk:
    enabled: true
    # Seconds a player may stay AFK in a marked region.
    max-afk-seconds: 900
    # Warn the player this many seconds before the kick.
    warn-before-seconds: 60
    # How far (blocks) a player has to walk from where they stopped to count as
    # back. Jumping on the spot or walking in a tiny circle doesn't count.
    min-move-distance: 2.5
    # Never kicked for AFK.
    bypass-permission: 'jester.afk.bypass'
    messages:
        warn: '&e[AFK] &fYou will be kicked in &c%seconds%s&f for being AFK here. Move to stay.'
        kick: '&c[AFK]\n&fYou were kicked for being AFK too long in a no-AFK area.'

# ----------------------------------------------------------------------------
#  Checks
# ----------------------------------------------------------------------------

# One block per check. Keys every check understands:
#   enabled              run the check at all
#   punishable           false = alert only
#   max-violations       violations before punishment-commands run
#   alert-interval       alert on every Nth violation
#   dont-alert-until     stay quiet below this many violations
#   alert-cooldown-ms    shortest gap between two alerts
#   minimum-tps          pause the check below this TPS
#   punishment-commands  console commands (%player% %check% %ping%)
# Anything left out comes from alert-defaults.
checks:

    # ── Movement prediction ───────────────────────────────────────────────────

    # Claiming to stand on the ground when the prediction says otherwise.
    GroundSpoof:
        enabled: true
        punishable: false
        max-violations: 20
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6b%check%&8 &7ping: %ping%ms&8)'

    # Movement prediction: fly, speed and most other movement hacks. Alert
    # only by default; set punishable once you trust it on your server.
    MovementA:
        enabled: true
        punishable: false
        max-violations: 40
        alert-interval: 1
        dont-alert-until: 6           # Ignore the first 5 flags (lag spike tolerance)
        alert-cooldown-ms: 2000       # Max 1 alert per 2s (prevents 1-100 spam)
        minimum-tps: 15.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bMovement&8 &7ping: %ping%ms&8)'

    # Claiming to be on the ground mid-fall to avoid fall damage.
    NoFall:
        enabled: true
        punishable: false
        max-violations: 20
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6b%check%&8 &7ping: %ping%ms&8)'

    # Moving through solid blocks.
    Phase:
        enabled: true
        punishable: true
        max-violations: 5
        alert-interval: 1
        dont-alert-until: 2
        alert-cooldown-ms: 1500
        minimum-tps: 15.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bMovement&8 &7ping: %ping%ms&8)'

    # ── Movement ──────────────────────────────────────────────────────────────

    # Jumping at the very edge of a ledge every time.
    AutoParkour:
        enabled: true
        punishable: true
        max-violations: 8
        alert-interval: 1
        dont-alert-until: 4
        alert-cooldown-ms: 3000
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bMovement&8 &7ping: %ping%ms&8)'

    # In the air, not falling, with nothing holding the player up. Works on
    # its own, so a fly that stays under MovementA's limit is still caught.
    Fly:
        enabled: true
        punishable: true
        max-violations: 2
        alert-interval: 1
        dont-alert-until: 1
        alert-cooldown-ms: 2000
        minimum-tps: 15.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bMovement&8 &7ping: %ping%ms&8)'

    # Jumping again instantly on every landing. Off by default: holding space
    # does the same in vanilla.
    NoJumpDelay:
        enabled: false
        punishable: false
        max-violations: 5
        alert-interval: 1
        dont-alert-until: 2
        alert-cooldown-ms: 1000
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bMovement&8 &7ping: %ping%ms&8)'

    # Not slowing down while eating, blocking or drawing a bow.
    NoSlow:
        enabled: true
        punishable: true
        max-violations: 10
        alert-interval: 1
        dont-alert-until: 3
        alert-cooldown-ms: 1500
        minimum-tps: 15.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bMovement&8 &7ping: %ping%ms&8)'

    # ── Timer ─────────────────────────────────────────────────────────────────

    # Sending movement slower than the client ticks.
    NegativeTimer:
        enabled: true
        punishable: false
        max-violations: 20
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6b%check%&8 &7ping: %ping%ms&8)'

    # Too many packets in total. Alert only by default, same reason as TimerA.
    PacketLimit:
        enabled: true
        punishable: false
        max-violations: 20
        alert-interval: 1
        dont-alert-until: 6
        alert-cooldown-ms: 2000
        minimum-tps: 19.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bMovement&8 &7ping: %ping%ms&8)'

    # Missing the end-of-tick packet.
    TickTimer:
        enabled: true
        punishable: false
        max-violations: 20
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6b%check%&8 &7ping: %ping%ms&8)'

    # Game running faster than real time. Alert only by default; proxies and
    # version translation make packet timing jumpy.
    TimerA:
        enabled: true
        punishable: false
        max-violations: 16           # More chances before kick (fewer false kicks)
        alert-interval: 1
        dont-alert-until: 6
        alert-cooldown-ms: 1500
        minimum-tps: 19.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bMovement&8 &7ping: %ping%ms&8)'

    # Vehicle movement sent faster than the client ticks.
    VehicleTimer:
        enabled: true
        punishable: false
        max-violations: 20
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6b%check%&8 &7ping: %ping%ms&8)'

    # ── Knockback ─────────────────────────────────────────────────────────────

    # Taking less explosion knockback than predicted.
    Explosion:
        enabled: true
        punishable: false
        max-violations: 20
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6b%check%&8 &7ping: %ping%ms&8)'

    # Taking less knockback than predicted (anti-knockback).
    Knockback:
        enabled: true
        punishable: true
        max-violations: 15
        alert-interval: 1
        dont-alert-until: 5
        alert-cooldown-ms: 2000
        minimum-tps: 15.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # ── Combat ────────────────────────────────────────────────────────────────

    # Using respawn anchors very fast.
    AnchorAura:
        enabled: true
        punishable: true
        max-violations: 3
        alert-interval: 1
        dont-alert-until: 1
        alert-cooldown-ms: 1000
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # Swapping to a heavy weapon for one hit and back (MC-28289). Only counts
    # when it repeats.
    AttributeSwap:
        enabled: true
        punishable: true
        max-violations: 5
        alert-interval: 1
        dont-alert-until: 3
        alert-cooldown-ms: 1000
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # Attacking while blocking with a shield.
    AutoBlock:
        enabled: true
        punishable: true
        max-violations: 5
        alert-interval: 1
        dont-alert-until: 2
        alert-cooldown-ms: 1000
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # Clicking too fast or too regularly.
    AutoClickerA:
        enabled: true
        punishable: true
        max-violations: 12
        alert-interval: 1
        dont-alert-until: 1
        alert-cooldown-ms: 1000
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # Several swings in one tick, over and over.
    AutoClickerB:
        enabled: true
        punishable: true
        max-violations: 20
        alert-interval: 1
        dont-alert-until: 3
        alert-cooldown-ms: 500
        minimum-tps: 19.5
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # Attacking for minutes without moving at all (AFK farm macro). If you
    # allow AFK farming, set punishable to false.
    AutoClickerC:
        enabled: true
        punishable: false
        max-violations: 3
        alert-interval: 1
        dont-alert-until: 1
        alert-cooldown-ms: 60000
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # Slow or randomised clicking, judged over several minutes.
    AutoClickerD:
        enabled: true
        punishable: false
        max-violations: 3
        alert-interval: 1
        dont-alert-until: 1
        alert-cooldown-ms: 60000
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # Drinking or throwing a potion the moment damage is taken.
    AutoPot:
        enabled: true
        punishable: true
        max-violations: 5
        alert-interval: 1
        dont-alert-until: 2
        alert-cooldown-ms: 1500
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # Putting a new totem in the off hand faster than a person can.
    AutoTotem:
        enabled: true
        punishable: true
        max-violations: 3
        alert-interval: 1
        dont-alert-until: 1
        alert-cooldown-ms: 500
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # Switching to the best weapon in the same tick as every hit.
    AutoWeapon:
        enabled: true
        punishable: true
        max-violations: 5
        alert-interval: 1
        dont-alert-until: 3
        alert-cooldown-ms: 1000
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # Placing beds very fast (bed bombing).
    BedAura:
        enabled: true
        punishable: true
        max-violations: 3
        alert-interval: 1
        dont-alert-until: 1
        alert-cooldown-ms: 1000
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # Fake critical hits.
    Criticals:
        enabled: true
        punishable: true
        max-violations: 5
        alert-interval: 1
        dont-alert-until: 2
        alert-cooldown-ms: 1000
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # End crystals placed and hit faster than a person can.
    CrystalAura:
        enabled: true
        punishable: true
        max-violations: 5
        alert-interval: 1
        dont-alert-until: 2
        alert-cooldown-ms: 1000
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # Releasing a bow too early. Off by default: the server works out arrow
    # power itself, and tapping a bow sends the same packets.
    FastBow:
        enabled: false
        punishable: false
        max-violations: 5
        alert-interval: 1
        dont-alert-until: 2
        alert-cooldown-ms: 1000
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # Eating or drinking too fast. Off by default: the server times this itself,
    # so the hack gains nothing, and the packet it relies on is sent every time
    # someone stops eating.
    FastUse:
        enabled: false
        punishable: false
        max-violations: 5
        alert-interval: 1
        dont-alert-until: 2
        alert-cooldown-ms: 1500
        minimum-tps: 14.0
        punishment-commands:
            - 'kick %player% &#c19a6bᴀᴄ &8» &fᴄʜᴇᴀᴛɪɴɢ ᴅᴇᴛᴇᴄᴛᴇᴅ &8(&#c19a6bCombat&8 &7ping: %ping%ms&8)'

    # Hitting outside the target's hitbox.
    Hitboxes:
        enabled: true
